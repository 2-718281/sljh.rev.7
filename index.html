<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
html,body{margin:0;padding:0;background:#080808;}
a{color:#dcdcdc;}a:hover{color:#fff;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slowIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes glitchShift{
0%{transform:translate(0,0);filter:none;opacity:1}
8%{transform:translate(-3%,1%) scaleY(1.02);filter:invert(1) contrast(2)}
14%{transform:translate(4%,-2%);filter:none}
22%{transform:translate(0,0);filter:brightness(4) saturate(0)}
30%{transform:translate(-6%,0) skewX(4deg);filter:invert(1)}
38%{transform:translate(2%,3%);filter:none}
50%{transform:translate(0,0);filter:brightness(6)}
62%{transform:translate(5%,-1%) skewX(-6deg);filter:invert(1) hue-rotate(180deg)}
74%{transform:translate(-2%,0);filter:none}
86%{transform:translate(0,0);filter:brightness(0.1)}
100%{transform:translate(0,0);filter:brightness(0)}
}
@keyframes glitchBars{
0%,100%{opacity:0}
10%{opacity:.9;transform:translateY(-14%)}
26%{opacity:.2;transform:translateY(22%)}
44%{opacity:.85;transform:translateY(-6%)}
60%{opacity:.1;transform:translateY(38%)}
80%{opacity:.6;transform:translateY(8%)}
}
@keyframes blueFlash{
0%{opacity:0}
6%{opacity:1}
12%{opacity:0}
20%{opacity:1}
26%{opacity:.1}
34%{opacity:1}
100%{opacity:1}
}
@keyframes invertOut{
0%{filter:none;opacity:1}
30%{filter:invert(1) brightness(1.6);opacity:1}
55%{filter:invert(1) brightness(3);opacity:1}
70%{filter:brightness(8) saturate(0);opacity:1}
100%{filter:brightness(12) saturate(0);opacity:0}
}
@keyframes whiteBurst{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes ripple{
0%{transform:scale(.25);opacity:0}
14%{opacity:.85}
100%{transform:scale(1.9);opacity:0}
}
@keyframes rollBar{0%{transform:translateY(-30%)}100%{transform:translateY(130%)}}
@keyframes jitter{0%,100%{transform:translate(0,0)}25%{transform:translate(-0.5%,0.3%)}50%{transform:translate(0.6%,-0.2%)}75%{transform:translate(-0.2%,-0.5%)}}
@keyframes flickerOp{0%,100%{opacity:.18}40%{opacity:.4}70%{opacity:.1}}
input::placeholder{color:rgba(255,255,255,0.22);}
</style>
</helmet>
<div style="width:100%;min-height:100vh;background:#080808;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif;overflow:hidden">
  <div style="position:relative;width:min(100vw,56.25vh);height:min(177.78vw,100vh);overflow:hidden;background:#111">

    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;animation:fadeIn 900ms ease both">
        <img src="uploads/封面.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
        <div style="position:absolute;left:24%;right:24%;top:31%;display:flex;flex-direction:column;gap:3vh;color:#e9e9e9">
          <div style="display:flex;flex-direction:column;gap:1vh;font-size:clamp(12px,1.95vh,24px);letter-spacing:0.4em;font-weight:300">
            <div style="opacity:.72">Rev.7</div>
            <div>招募问卷废案</div>
          </div>
          <div style="display:flex;align-items:baseline;gap:0.8em;font-size:clamp(12px,1.95vh,24px);letter-spacing:0.4em;font-weight:300">
            <span>密码</span>
            <input type="password" value="{{ pw }}" onChange="{{ onPw }}" onKeyDown="{{ onKey }}" autoFocus="{{ true }}" style="flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,0.6);outline:none;color:#fff;font-family:inherit;font-size:inherit;letter-spacing:0.4em;padding:0 0 0.35em 0" />
          </div>
          <div style="display:flex;align-items:center;gap:1.4em;margin-top:0.4vh">
            <button onClick="{{ submit }}" style="background:transparent;border:1px solid rgba(255,255,255,0.5);color:#e9e9e9;font-family:inherit;font-size:clamp(11px,1.55vh,19px);letter-spacing:0.35em;padding:0.7em 1.5em 0.7em 1.85em;cursor:pointer;transition:all 200ms" style-hover="background:rgba(255,255,255,0.12);border-color:#fff">开启</button>
            <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
              <span style="color:#a8a8a8;font-size:clamp(10px,1.4vh,17px);letter-spacing:0.2em;animation:fadeIn 300ms both">密码不符</span>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isLetter }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;animation:fadeIn 1100ms ease both">
        <img src="uploads/开封.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
        <div style="position:absolute;left:26%;right:24%;top:37%;bottom:26%;display:flex;flex-direction:column;color:#efefef">
          <sc-if value="{{ isQ }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:clamp(9px,1.25vh,15px);letter-spacing:0.4em;color:rgba(255,255,255,0.4);margin-bottom:2.2vh">{{ counter }}</div>
          </sc-if>
          <div style="font-size:clamp(11px,1.75vh,22px);line-height:2.15;letter-spacing:0.05em;white-space:pre-wrap;font-weight:300;text-wrap:pretty">{{ typed }}<span style="display:inline-block;width:0.55em;animation:blink 900ms step-end infinite">_</span></div>
          <div style="flex:1"></div>
          <sc-if value="{{ showIntroBtn }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;animation:fadeIn 700ms both">
              <button onClick="{{ begin }}" style="background:transparent;border:1px solid rgba(255,255,255,0.5);color:#efefef;font-family:inherit;font-size:clamp(11px,1.55vh,19px);letter-spacing:0.35em;padding:0.75em 1.4em 0.75em 1.75em;cursor:pointer;transition:all 200ms" style-hover="background:rgba(255,255,255,0.13);border-color:#fff">开始</button>
            </div>
          </sc-if>
          <sc-if value="{{ showChoices }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;gap:1.2em;animation:fadeIn 700ms both">
              <button onClick="{{ agree }}" style="flex:1;background:transparent;border:1px solid rgba(255,255,255,0.5);color:#efefef;font-family:inherit;font-size:clamp(11px,1.55vh,19px);letter-spacing:0.3em;padding:0.85em 0 0.85em 0.3em;cursor:pointer;transition:all 200ms" style-hover="background:rgba(255,255,255,0.14);border-color:#fff">同意</button>
              <button onClick="{{ oppose }}" style="flex:1;background:transparent;border:1px solid rgba(255,255,255,0.5);color:#efefef;font-family:inherit;font-size:clamp(11px,1.55vh,19px);letter-spacing:0.3em;padding:0.85em 0 0.85em 0.3em;cursor:pointer;transition:all 200ms" style-hover="background:rgba(255,255,255,0.14);border-color:#fff">反对</button>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isGlitch }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#000;overflow:hidden">
        <img src="uploads/开封.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:glitchShift 900ms steps(1,end) both" />
        <div style="position:absolute;left:-10%;right:-10%;top:0;height:22%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.75) 0 2px,rgba(0,0,0,0) 2px 5px);mix-blend-mode:screen;animation:glitchBars 900ms steps(1,end) both"></div>
        <div style="position:absolute;left:-10%;right:-10%;top:45%;height:14%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,rgba(0,0,0,0) 1px 4px);mix-blend-mode:screen;animation:glitchBars 700ms steps(1,end) both;animation-delay:120ms"></div>
      </div>
    </sc-if>

    <sc-if value="{{ isBlackText }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:0 13%;animation:fadeIn 900ms ease both">
        <div style="color:#f2f2f2;font-size:clamp(12px,1.9vh,23px);line-height:2.1;letter-spacing:0.07em;text-align:center;font-weight:300;white-space:pre-wrap">{{ typed }}<span style="display:inline-block;width:0.55em;animation:blink 900ms step-end infinite">_</span></div>
      </div>
    </sc-if>

    <sc-if value="{{ isSnow }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#000;overflow:hidden;animation:fadeIn 220ms both">
        <canvas ref="{{ snowRef }}" width="180" height="320" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.92"></canvas>
        <div style="position:absolute;left:0;right:0;height:16%;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 100%);animation:rollBar 1.6s linear infinite"></div>
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.45) 0 1px,rgba(0,0,0,0) 1px 3px)"></div>
      </div>
    </sc-if>

    <sc-if value="{{ isBlackout }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#000">
        <img src="uploads/黑屏.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
      </div>
    </sc-if>

    <sc-if value="{{ isBlueFlash }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#000;overflow:hidden">
        <img src="uploads/蓝色的船背景.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:blueFlash 1200ms steps(1,end) both" />
      </div>
    </sc-if>

    <sc-if value="{{ isBlueText }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#1b1bd8;overflow:hidden">
        <img src="uploads/蓝色的船背景.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
        <div style="position:absolute;left:8%;right:8%;top:42.6%;display:flex;justify-content:center;align-items:baseline;color:#fff;font-size:clamp(14px,2.25vh,28px);font-weight:300;letter-spacing:0.04em">
          <span style="white-space:pre">{{ typed }}</span><span style="display:inline-block;width:0.5em;animation:blink 900ms step-end infinite">_</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isInvert }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#fff;overflow:hidden">
        <div style="position:absolute;inset:0;animation:invertOut 700ms ease-in both">
          <img src="uploads/蓝色的船背景.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
          <div style="position:absolute;left:8%;right:8%;top:42.6%;display:flex;justify-content:center;color:#fff;font-size:clamp(14px,2.25vh,28px);font-weight:300;letter-spacing:0.04em">Bene venisti domum!</div>
        </div>
        <div style="position:absolute;inset:0;background:#fff;animation:whiteBurst 700ms ease-in both"></div>
      </div>
    </sc-if>

    <sc-if value="{{ isWhite }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ restart }}" style="position:absolute;inset:0;background:#efefee;cursor:pointer;overflow:hidden;animation:slowIn 1400ms ease both">
        <img src="uploads/白色的船效果.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
        <div style="position:absolute;left:50%;top:28.6%;width:26%;aspect-ratio:1;margin-left:-13%;margin-top:-13%;border:1px solid rgba(40,40,40,.55);border-radius:50%;animation:ripple 5.5s ease-out infinite"></div>
        <div style="position:absolute;left:50%;top:28.6%;width:26%;aspect-ratio:1;margin-left:-13%;margin-top:-13%;border:1px solid rgba(40,40,40,.4);border-radius:50%;animation:ripple 5.5s ease-out infinite;animation-delay:1.8s"></div>
        <div style="position:absolute;left:46.3%;top:52.6%;width:94%;aspect-ratio:1;margin-left:-47%;margin-top:-47%;border:1px solid rgba(40,40,40,.4);border-radius:50%;animation:ripple 8s ease-out infinite"></div>
        <div style="position:absolute;left:46.3%;top:52.6%;width:94%;aspect-ratio:1;margin-left:-47%;margin-top:-47%;border:1px solid rgba(40,40,40,.28);border-radius:50%;animation:ripple 8s ease-out infinite;animation-delay:3.2s"></div>
      </div>
    </sc-if>

    <sc-if value="{{ isBlackShip }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ restart }}" style="position:absolute;inset:0;background:#000;cursor:pointer;overflow:hidden;animation:slowIn 1600ms ease both">
        <img src="uploads/黑色的船.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:jitter 3.4s steps(4,end) infinite" />
        <canvas ref="{{ noiseRef }}" width="180" height="320" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;mix-blend-mode:screen;animation:flickerOp 2.6s ease-in-out infinite"></canvas>
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 1px,rgba(0,0,0,0) 1px 3px);pointer-events:none"></div>
        <div style="position:absolute;left:0;right:0;height:10%;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.1) 50%,rgba(255,255,255,0) 100%);animation:rollBar 4.2s linear infinite;pointer-events:none"></div>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;password&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;signa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;typeSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:85,&quot;min&quot;:20,&quot;max&quot;:200,&quot;step&quot;:5,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;blueThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { screen: 'login', pw: '', err: false, qi: 0, yes: 0, typed: '', done: false };
  snowRef = React.createRef();
  noiseRef = React.createRef();

  QS = [
    '你对一个充满分歧的个体社会感到厌恶。',
    '完全和谐、没有冲突的集体意识比充满分歧的个体社会更“完美”。',
    '抛下同伴独自逃生是一种不可饶恕的罪。',
    '会伤害他人的真相应该被隐瞒。',
    '你会因为他人将自认为正确的未来强加给你而憎恨。',
    '你愿为不可能的希望拼尽全力。',
    '“自我”是一组连续感知的集合，而非某个固定不变的灵魂实体。',
    '“家”是一段记忆或一种情感状态，而非一个物理坐标。',
    '我们可以一起“回家”。',
    '对该问卷你如实表达了你的想法。'
  ];
  INTRO = '这是一份用于了解你是否适合于我们同行的问卷，\n你只需要用“是”或“否”来表达你的看法。';
  FOG = '迷雾将我们分隔，\n我们从未真正对话过。';
  HOME = 'Bene venisti domum!';

  type(text, after) {
    clearInterval(this._t); clearTimeout(this._a);
    this.setState({ typed: '', done: false });
    let i = 0;
    const speed = this.props.typeSpeed ?? 85;
    this._t = setInterval(() => {
      i++;
      this.setState({ typed: text.slice(0, i) });
      if (i >= text.length) {
        clearInterval(this._t);
        this.setState({ done: true });
        if (after) this._a = setTimeout(after, 1900);
      }
    }, speed);
  }

  go(screen, ms, next) {
    clearTimeout(this._s);
    this.setState({ screen });
    if (next) this._s = setTimeout(next, ms);
  }

  componentDidUpdate() {
    const c = this.state.screen === 'snow' ? this.snowRef.current
      : this.state.screen === 'blackship' ? this.noiseRef.current : null;
    if (c && this._canvas !== c) { this._canvas = c; this.loop(c, this.state.screen === 'snow' ? 1 : 0.55); }
    if (!c) { this._canvas = null; cancelAnimationFrame(this._raf); }
  }
  componentWillUnmount() {
    clearInterval(this._t); clearTimeout(this._a); clearTimeout(this._s); cancelAnimationFrame(this._raf);
  }

  loop(canvas, gain) {
    cancelAnimationFrame(this._raf);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const img = ctx.createImageData(w, h);
    const draw = () => {
      if (this._canvas !== canvas) return;
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) * gain;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      this._raf = requestAnimationFrame(draw);
    };
    draw();
  }

  submit = () => {
    const pass = this.props.password ?? 'signa';
    if (this.state.pw.trim().toLowerCase() === String(pass).toLowerCase()) {
      this.setState({ screen: 'intro', err: false });
      this.type(this.INTRO);
    } else { this.setState({ err: true }); }
  };

  begin = () => { this.setState({ screen: 'q', qi: 0, yes: 0 }); this.type(this.QS[0]); };

  ending() {
    const threshold = this.props.blueThreshold ?? 5;
    if (this.state.yes >= threshold) {
      this.go('blueflash', 1250, () => {
        this.setState({ screen: 'bluetext' });
        this.type(this.HOME, () => this.go('invert', 700, () => this.go('white')));
      });
    } else {
      this.go('blackship');
    }
  }

  finish(lastNo) {
    if (lastNo) {
      this.go('glitch', 900, () => {
        this.setState({ screen: 'blacktext' });
        this.type(this.FOG, () => this.go('snow', 2400, () => this.go('blackout', 2000, () => this.ending())));
      });
    } else { this.ending(); }
  }

  answer(agree) {
    const qi = this.state.qi;
    const yes = this.state.yes + (agree ? 1 : 0);
    const last = qi >= this.QS.length - 1;
    this.setState({ yes }, () => {
      if (last) { clearInterval(this._t); this.finish(!agree); return; }
      this.setState({ qi: qi + 1 });
      this.type(this.QS[qi + 1]);
    });
  }

  restart = () => {
    clearInterval(this._t); clearTimeout(this._a); clearTimeout(this._s);
    this.setState({ screen: 'login', pw: '', err: false, qi: 0, yes: 0, typed: '', done: false });
  };

  renderVals() {
    const s = this.state;
    return {
      isLogin: s.screen === 'login',
      isLetter: s.screen === 'intro' || s.screen === 'q',
      isQ: s.screen === 'q',
      isGlitch: s.screen === 'glitch',
      isBlackText: s.screen === 'blacktext',
      isSnow: s.screen === 'snow',
      isBlackout: s.screen === 'blackout',
      isBlueFlash: s.screen === 'blueflash',
      isBlueText: s.screen === 'bluetext',
      isInvert: s.screen === 'invert',
      isWhite: s.screen === 'white',
      isBlackShip: s.screen === 'blackship',
      typed: s.typed,
      counter: String(s.qi + 1).padStart(2, '0') + ' / ' + String(this.QS.length).padStart(2, '0'),
      showIntroBtn: s.screen === 'intro' && s.done,
      showChoices: s.screen === 'q' && s.done,
      pw: s.pw,
      err: s.err,
      snowRef: this.snowRef,
      noiseRef: this.noiseRef,
      onPw: (e) => this.setState({ pw: e.target.value, err: false }),
      onKey: (e) => { if (e.key === 'Enter') this.submit(); },
      submit: this.submit,
      begin: this.begin,
      agree: () => this.answer(true),
      oppose: () => this.answer(false),
      restart: this.restart
    };
  }
}
</script>
</body>
</html>
